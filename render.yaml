services:
  - type: web
    name: hiram-agent
    runtime: docker
    repo: https://github.com/asignaciondetareashiramchile-sketch/hiram-agent
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: 8080
      - key: BASE_URL
        value: https://hiram-agent.onrender.com
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: hiram-db
          property: connectionString

databases:
  - name: hiram-db
    databaseName: hiram
    plan: free
    region: oregon
    version: 16
