services:
  - type: web
    name: hiram-agent
    runtime: docker
    repo: https://github.com/TU_USUARIO/hiram-agent
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: 8080
      - key: BASE_URL
        value: https://hiram-agent.onrender.com
      - key: SECRET_KEY
        generateValue: true
