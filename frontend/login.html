<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hiram Chile – ProClean Facilities | Login</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .login-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #1a237e 0%, #283593 50%, #3949ab 100%); }
        .login-card { background: white; border-radius: 16px; padding: 40px; width: 380px; max-width: 90vw; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .login-logo { width: 64px; height: 64px; background: linear-gradient(135deg, #1a237e, #3949ab); border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 28px; color: white; font-weight: 800; margin: 0 auto 16px; }
        .login-title { text-align: center; font-size: 20px; font-weight: 700; color: #1a237e; margin-bottom: 4px; }
        .login-subtitle { text-align: center; font-size: 13px; color: #666; margin-bottom: 24px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: #333; margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 12px 16px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 14px; box-sizing: border-box; }
        .form-group input:focus { outline: none; border-color: #1a73e8; }
        .btn-login { width: 100%; padding: 12px; background: #1a237e; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
        .btn-login:hover { background: #283593; }
        .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }
        .error-msg { background: #f8d7da; color: #721c24; padding: 10px; border-radius: 8px; margin-top: 12px; display: none; font-size: 13px; text-align: center; }
        .loading { text-align: center; padding: 10px; color: #666; display: none; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">H</div>
            <div class="login-title">Hiram Chile</div>
            <div class="login-subtitle">Sistema de Gestión de Agentes IA</div>
            <form id="login-form" onsubmit="return doLogin(event)">
                <div class="form-group">
                    <label>Usuario</label>
                    <input type="text" id="username" placeholder="Ingresa tu usuario" required autofocus>
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="password" placeholder="Ingresa tu contraseña" required>
                </div>
                <button type="submit" class="btn-login" id="login-btn">Iniciar Sesión</button>
                <div class="loading" id="loading">Iniciando sesión...</div>
                <div class="error-msg" id="error-msg">Credenciales inválidas</div>
            </form>
        </div>
    </div>
    <script>
        async function doLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            const loading = document.getElementById('loading');
            const error = document.getElementById('error-msg');
            btn.disabled = true;
            loading.style.display = 'block';
            error.style.display = 'none';
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        password: document.getElementById('password').value
                    })
                });
                if (res.ok) {
                    window.location.href = '/';
                } else {
                    error.style.display = 'block';
                    error.textContent = '❌ Usuario o contraseña incorrectos';
                }
            } catch(e) {
                error.style.display = 'block';
                error.textContent = '❌ Error de conexión';
            }
            btn.disabled = false;
            loading.style.display = 'none';
        }
    </script>
</body>
</html>
